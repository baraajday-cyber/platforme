{% extends "base.html" %}
{% block title %}{{ '✏️ Modifier' if groupe else '➕ Nouveau' }} groupe — Admin{% endblock %}
{% block content %}
<div class="page-header">
  <div class="container">
    <h2>{{ '✏️ Modifier' if groupe else '➕ Nouveau' }} groupe</h2>
  </div>
</div>
<div class="container pb-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card-fun p-5">
        <form method="POST">
          <div class="mb-3">
            <label class="lbl">🏷️ Nom du groupe *</label>
            <input type="text" name="nom" class="form-control-fun" value="{{ groupe.nom if groupe else '' }}" required maxlength="80">
          </div>
          <div class="mb-3">
            <label class="lbl">📝 Description</label>
            <textarea name="description" class="form-control-fun" rows="3" placeholder="Ex: Débutant A, Standard, etc.">{{ groupe.description if groupe else '' }}</textarea>
          </div>
          <div class="mb-4">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" name="actif" id="actif" style="width:44px;height:24px" {{ 'checked' if not groupe or (groupe and groupe.actif) }}>
              <label class="form-check-label fw-800" for="actif">✅ Groupe actif</label>
            </div>
          </div>

          <div class="d-flex gap-3">
            <button type="submit" class="btn btn-fun btn-sky fw-800 px-5">💾 Enregistrer</button>
            <a href="{{ url_for('admin_groupes') }}" class="btn btn-fun btn-outline-fun px-4">← Annuler</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
